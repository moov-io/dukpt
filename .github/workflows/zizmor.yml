# Use https://app.stepsecurity.io/ to improve workflow security
name: zizmor

on:
  push:
  pull_request:
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

concurrency:
  group: zizmor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  zizmor:
    permissions:
      security-events: write
      contents: read
      actions: read
    uses: moov-io/.github/.github/workflows/zizmor.yml@768836368a4ebdf0959c6497d41433e7193103cc
